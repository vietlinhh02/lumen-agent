[project]
name = "literature-review-backend"
version = "0.1.0"
description = "FastAPI backend for the AI Literature Review Assistant."
readme = "BACKEND.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.136.3",
    "pydantic-settings==2.14.1",
    "email-validator>=2.1.0",
    "uvicorn[standard]==0.48.0",
    "sqlalchemy[asyncio]==2.0.41",
    "asyncpg==0.30.0",
    "python-jose[cryptography]==3.4.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "python-multipart==0.0.20",
    # AI providers
    "anthropic>=0.49.0",
    "openai>=1.50.0",
    # Agent orchestration
    "langgraph>=0.2.0",
    # HTTP client for source adapters
    "httpx>=0.27.0",
    "paperhub-cli==0.1.0",
    # PDF text extraction
    "pypdf>=5.0.0",
    # Google AI (Gemini API) — fallback for image-only PDFs
    "google-genai>=1.15.0",
    # Embeddings + reranking via NVIDIA API (no local model)
    "pgvector>=0.4.2",
]

[dependency-groups]
dev = [
    "httpx2==2.2.0",
    "pytest==9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff==0.15.15",
    "ty==0.0.40",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
ignore = ["B008"]

[tool.ty.rules]
all = "error"

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = [
    "error",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

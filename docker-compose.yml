services:
  db:
    image: postgres:16-alpine
    container_name: litreview-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: litreview
      POSTGRES_PASSWORD: litreview
      POSTGRES_DB: litreview
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
